spring:
  application:
    name: daily-problem-tracker-service
  sql:
    init:
      mode: always
  datasource:
    # Defaults point at the local docker-compose Postgres, so a fresh clone
    # runs with no setup. They are NOT secrets — the same values are in
    # docker-compose.yml. Production overrides all three via the environment.
    #
    # To point at Neon instead, set DATABASE_URL / DATABASE_USERNAME /
    # DATABASE_PASSWORD. Never put a real password back in this file: a
    # committed fallback is a live credential in every clone of the repo.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/daily_problem_tracker}
    username: ${DATABASE_USERNAME:tracker_user}
    password: ${DATABASE_PASSWORD:tracker_password}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: 30000
      idle-timeout: 300000
      # Neon's pooler recycles connections, and a free-tier compute suspends
      # after a few minutes idle; expire ours first so we never hand out a
      # socket the server has already closed.
      max-lifetime: 900000
      keepalive-time: 120000
      # A single-user tracker does not need 10 connections, and the free-tier
      # pooler counts every one of them.
      maximum-pool-size: 5
      minimum-idle: 1
      data-source-properties:
        # CRITICAL when using Neon's POOLED endpoint (the hostname carrying a
        # "-pooler" suffix), which is PgBouncer in TRANSACTION mode.
        #
        # The Postgres JDBC driver promotes a query to a server-side prepared
        # statement after 5 executions. A transaction-mode pooler hands each
        # transaction a different backend, so the statement is missing — or
        # belongs to someone else — and you get intermittent
        #   "prepared statement S_1 already exists" / "does not exist"
        # errors that look exactly like random downtime.
        #
        # 0 disables server-side prepared statements. Harmless on Neon's direct
        # endpoint, required on the pooled one.
        prepareThreshold: 0
        preparedStatementCacheQueries: 0
  jpa:
    hibernate:
      ddl-auto: update
    # schema.sql only contains ALTER TABLE statements, so it has to run AFTER
    # Hibernate has created the tables. Without this it runs first and fails
    # against an empty database.
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          # Google's OIDC issuer — do not change
          issuer-uri: https://accounts.google.com

app:
  google:
    # OAuth client IDs are public by design (this one already ships inside the
    # extension manifest and the web bundle), so defaulting it is safe and
    # keeps local runs friction-free. Override per environment if it changes.
    client-id: ${GOOGLE_CLIENT_ID:683627191123-5551q39di0quqsd7p3oj1nt6oodlajfe.apps.googleusercontent.com}
  gemini:
    # Optional: a server-side fallback key. Users can supply their own in Settings.
    api-key: ${GEMINI_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,chrome-extension://*,https://*.netlify.app}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Health only. Never expose env/configprops/beans publicly — they leak
        # the database URL and other configuration.
        include: health
  endpoint:
    health:
      # "db: UP" vs "db: DOWN" is the whole point of having this.
      show-details: never
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
