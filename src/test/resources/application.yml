# Test profile: in-memory H2, no cloud credentials, no network at startup.
spring:
  datasource:
    url: jdbc:h2:mem:dpt;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      # schema.sql holds Postgres-flavoured migrations for the real database.
      mode: never

app:
  google:
    client-id: test-client-id.apps.googleusercontent.com
  gemini:
    api-key: test-key
  cors:
    allowed-origins: http://localhost:*

logging:
  level:
    org.springframework.security: WARN
